server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 연합 리모트가 얹히는 자리이며 자산이 없으면 화면 라우트로 되받지 않고 404를 낸다.
    location /remote/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
}
