worker_processes 1;
events { worker_connections 1024; }
http {
  # Docker 내장 DNS다. 변수로 넘긴 proxy_pass는 이 resolver의 TTL마다 다시 해석되어
  # 컨테이너가 다시 만들어져 내부 IP가 바뀌어도 캐시가 고이지 않는다.
  resolver 127.0.0.11 valid=10s;

  # 에이전트 상류 선언이 이 표를 채운다. 선언이 없으면 값이 비어 에이전트 경로가 501이고,
  # 선언이 둘 이상이면 파라미터 없는 요청에 ambiguous가 남아 400이다.
  map $arg_backend $agent_api {
    include /etc/nginx/upstreams.d/*.map;
  }

  # 같은 상류 선언이 이 표에 목록 응답을 채운다. 선언이 없으면 값이 비어 목록 창구도 501이다.
  map $host $agent_upstreams {
    include /etc/nginx/upstreams.d/*.catalog;
  }

  # backend 는 게이트웨이가 소비하는 값이라 상류로 가는 질의 문자열에서 빠진다.
  map $args $agent_args {
    "~^backend=[^&]*$"                          "";
    "~^backend=[^&]*&(?<rest>.*)$"              $rest;
    "~^(?<head>.*)&backend=[^&]*&(?<tail>.*)$"  "$head&$tail";
    "~^(?<head>.*)&backend=[^&]*$"              $head;
    default                                     $args;
  }

  map $agent_args $agent_query {
    ""      "";
    default "?$agent_args";
  }

  # 에이전트 화면 선언이 이 표를 채운다. 선언이 없으면 값이 비어 리모트 진입점이 404이고
  # 대시보드는 해당 라우트를 등록하지 않은 채 그대로 돈다.
  map $host $agent_web {
    include /etc/nginx/remotes.d/*.map;
  }

  server {
    listen 3847;
    client_max_body_size 5m;

    set $ingest_api http://ingest-api:3901;
    set $tracer_api http://tracer-api:3902;
    set $tracer_web http://tracer-web;
    set $agent_absent '{"ok":false,"error":{"code":"agent_not_installed","message":"Agent service is not declared for this deployment."}}';

    location /ingest/ { proxy_pass $ingest_api; }

    # 배포 단위 사이에서만 오가는 창구라 바깥에 열지 않는다.
    location /internal/ { return 404; }

    # 선언된 상류의 목록은 배포가 정하므로 게이트웨이가 답하고 상류에 묻지 않는다.
    location = /api/agent/upstreams {
      default_type application/json;
      if ($agent_upstreams = "") { return 501 $agent_absent; }
      return 200 $agent_upstreams;
    }

    # 에이전트 서비스가 이 접두사 자체를 열므로 경로를 그대로 넘긴다.
    location /api/agent/ {
      default_type application/json;
      if ($agent_api = "") { return 501 $agent_absent; }
      if ($agent_api = "ambiguous") { return 400 '{"ok":false,"error":{"code":"agent_backend_ambiguous","message":"More than one agent backend is declared; pass backend to choose one."}}'; }
      proxy_pass $agent_api$uri$agent_query;
    }

    location /agent/ {
      if ($agent_web = "") { return 404; }
      rewrite ^/agent/(.*)$ /$1 break;
      proxy_pass $agent_web;
    }

    location /ws {
      proxy_pass $tracer_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location /api { proxy_pass $tracer_api; }

    location /health { proxy_pass $tracer_api; }

    # 브라우저가 포트 하나만 보므로 나머지 경로는 대시보드의 정적 자산이다.
    location / { proxy_pass $tracer_web; }
  }
}
