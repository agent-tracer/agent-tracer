name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 별칭 신선도
        run: npm run check:paths

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm run test

      - name: 빌드
        run: npm run build

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [migrate, ingest-api, tracer-api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: agent-tracer/${{ matrix.target }}:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 상류 선언이 없는 게이트웨이 설정
        run: |
          docker run --rm \
            -v "$PWD/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/gateway/upstreams.d:/etc/nginx/upstreams.d:ro" \
            nginx:1.27-alpine nginx -t

  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 커밋 범위 결정
        id: range
        run: |
          set -euo pipefail
          # force-push은 이전 tip을 버리므로 그 커밋이 아직 있는지 확인하고 없으면 새 커밋만 본다.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "value=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: 커밋 메시지
        run: |
          set -euo pipefail
          # 범위가 성립하지 않으면 조용히 0건을 검사하고 통과하므로 먼저 목록을 세운다.
          shas=$(git log "${{ steps.range.outputs.value }}" --format=%H)
          failed=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            # 어느 커밋이 걸렸는지 없으면 위반 목록만 여러 벌 쌓여 원인을 못 찾는다.
            node scripts/check-commit-msg.mjs "$RUNNER_TEMP/msg" \
              || { echo "  ↳ $(git log -1 --format='%h %s' "$sha")"; failed=1; }
          done
          exit $failed

      - name: 공동 작성자
        run: node scripts/check-coauthors.mjs --range "${{ steps.range.outputs.value }}"
